<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gemma 4 12B · 模型控制台</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --border:#e2e8f0; --text:#1f2933;
    --muted:#64748b; --accent:#2563eb; --accent-soft:#eff6ff;
    --ok:#16a34a; --warn:#d97706; --err:#dc2626; --code-bg:#f1f5f9;
  }
  html[data-theme="dark"]{
    --bg:#0f1115; --panel:#171a21; --border:#262b36; --text:#e6e9ef;
    --muted:#9aa4b2; --accent:#3b82f6; --accent-soft:#16233b;
    --ok:#22c55e; --warn:#f59e0b; --err:#f87171; --code-bg:#0c0e12;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);min-height:100vh;}
  header{background:var(--panel);border-bottom:1px solid var(--border);padding:14px 22px;
         display:flex;align-items:center;justify-content:space-between;}
  header h1{font-size:17px;margin:0;font-weight:600;}
  header .tag{font-size:12px;color:var(--muted);margin-left:10px;}
  .theme-btn,.chat-btn{cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);
             border-radius:8px;padding:6px 12px;font-size:14px;text-decoration:none;}
  .wrap{max-width:1080px;margin:22px auto;padding:0 18px;display:grid;gap:18px;
        grid-template-columns:1fr 1fr;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;}
  .card h2{font-size:14px;margin:0 0 14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .full{grid-column:1 / -1;}
  .state-badge{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;padding:8px 14px;
               border-radius:999px;border:1px solid var(--border);}
  .dot{width:10px;height:10px;border-radius:50%;}
  .s-stopped{color:var(--err);} .s-stopped .dot{background:var(--err);}
  .s-starting{color:var(--warn);} .s-starting .dot{background:var(--warn);}
  .s-running{color:var(--ok);} .s-running .dot{background:var(--ok);}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin-top:14px;}
  .kv .k{color:var(--muted);} .kv .v{word-break:break-all;font-family:ui-monospace,Consolas,monospace;}
  .btn-row{display:flex;gap:10px;margin-top:4px;}
  button.act{cursor:pointer;border:none;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:600;
             color:#fff;background:var(--accent);transition:opacity .15s;}
  button.act:hover{opacity:.9;} button.act:disabled{opacity:.4;cursor:not-allowed;}
  button.danger{background:var(--err);}
  .field{margin-top:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  .field input{width:100%;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;
               background:var(--bg);color:var(--text);font-family:ui-monospace,Consolas,monospace;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  pre.log{background:var(--code-bg);border:1px solid var(--border);border-radius:10px;padding:12px;
          height:240px;overflow:auto;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-all;margin:0;}
  .gpu-line{font-size:13px;font-family:ui-monospace,Consolas,monospace;padding:6px 0;border-bottom:1px dashed var(--border);}
  .hint{font-size:12px;color:var(--muted);margin-top:10px;}
  @media(max-width:820px){.wrap{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <div><h1 style="display:inline">Gemma 4 12B · 模型控制台</h1><span class="tag">启停 / 状态 / 日志 / 显存</span></div>
  <div>
    <a class="chat-btn" href="/chat">打开聊天</a>
    <button class="theme-btn" id="themeBtn" title="切换浅/深色">◐ 主题</button>
  </div>
</header>

<div class="wrap">
  <!-- 状态 -->
  <div class="card">
    <h2>运行状态</h2>
    <div id="stateBadge" class="state-badge s-stopped"><span class="dot"></span><span id="stateText">停止</span></div>
    <div class="kv">
      <div class="k">进程</div><div class="v" id="kProc">—</div>
      <div class="k">上游 API</div><div class="v" id="kUp">—</div>
      <div class="k">上游地址</div><div class="v" id="kUpUrl">—</div>
      <div class="k">llama-server</div><div class="v" id="kBin">—</div>
      <div class="k">权重</div><div class="v" id="kModel">—</div>
      <div class="k">上下文 / 卸载层</div><div class="v" id="kCtxNgl">—</div>
    </div>
  </div>

  <!-- 显存 -->
  <div class="card">
    <h2>GPU / 显存</h2>
    <div id="gpuBox"><div class="hint">读取中…</div></div>
  </div>

  <!-- 控制 -->
  <div class="card">
    <h2>控制</h2>
    <div class="btn-row">
      <button class="act" id="btnStart">▶ 启动</button>
      <button class="act danger" id="btnStop" disabled>■ 停止</button>
      <button class="act" id="btnRestart" disabled>↻ 重启</button>
    </div>
    <div class="hint" id="ctrlHint">启动将从后端拉起 llama-server 并加载模型（约数十秒）。</div>
  </div>

  <!-- 参数 -->
  <div class="card">
    <h2>启动参数（可选覆盖）</h2>
    <div class="field">
      <label>权重路径 (model_path)</label>
      <input id="pModel" placeholder="D:\models\gemma-4-12b-Q4_K_M.gguf" />
    </div>
    <div class="row3">
      <div class="field"><label>上下文 (ctx)</label><input id="pCtx" placeholder="32768" /></div>
      <div class="field"><label>GPU 层 (ngl)</label><input id="pNgl" placeholder="999" /></div>
      <div class="field"><label>采样</label><input value="temp1.0 / top-p0.95 / top-k64" disabled /></div>
    </div>
    <div class="hint">留空则使用后端默认配置（来自环境变量 / 启动脚本）。</div>
  </div>

  <!-- 日志 -->
  <div class="card full">
    <h2>实时日志（llama-server 输出）</h2>
    <pre class="log" id="log">— 暂无日志 —</pre>
  </div>
</div>

<script>
// ---- 主题 ----
const root = document.documentElement;
const saved = localStorage.getItem('gemma-admin-theme') || 'light';
root.setAttribute('data-theme', saved);
document.getElementById('themeBtn').onclick = () => {
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  localStorage.setItem('gemma-admin-theme', next);
};

// ---- API 基址自适应 ----
const API = (location.protocol.startsWith('http') && !location.host.endsWith(':8080'))
  ? location.origin
  : 'http://127.0.0.1:8081';

const $ = id => document.getElementById(id);
const logEl = $('log');
let lastLogLen = 0;

function setStatus(state){
  const map = {stopped:['停止','s-stopped'], starting:['启动中','s-starting'], running:['运行中','s-running']};
  const [txt, cls] = map[state] || ['未知','s-stopped'];
  const badge = $('stateBadge');
  badge.className = 'state-badge ' + cls;
  $('stateText').textContent = txt;
  $('btnStart').disabled = (state === 'running' || state === 'starting');
  $('btnStop').disabled  = (state === 'stopped');
  $('btnRestart').disabled = (state !== 'running');
}

async function refreshStatus(){
  try{
    const r = await fetch(API + '/admin/status');
    const d = await r.json();
    setStatus(d.state);
    $('kProc').textContent  = d.process ? '存活' : '未运行';
    $('kUp').textContent    = d.upstream ? '就绪 ✓' : '未就绪';
    $('kUpUrl').textContent = d.upstream_url || '—';
    $('kBin').textContent   = d.llama_bin || '—';
    $('kModel').textContent = d.model_path || '—';
    $('kCtxNgl').textContent= (d.ctx||'?') + ' / ' + (d.ngl||'?');
    // 回填参数表单（仅当为空）
    if(!$('pModel').value) $('pModel').value = d.model_path || '';
    if(!$('pCtx').value)   $('pCtx').value   = d.ctx || '';
    if(!$('pNgl').value)   $('pNgl').value   = d.ngl || '';
  }catch(e){ setStatus('stopped'); $('ctrlHint').textContent = '无法连接 Go 后端('+API+')，请先启动 gemma-backend。'; }
}

async function refreshGPU(){
  try{
    const r = await fetch(API + '/admin/gpu');
    const d = await r.json();
    const box = $('gpuBox');
    if(d.ok){
      box.innerHTML = (d.lines||[]).map(l => '<div class="gpu-line">'+escapeHtml(l)+'</div>').join('');
    }else{
      box.innerHTML = '<div class="hint">未检测到 GPU / nvidia-smi：'+escapeHtml(String(d.error||''))+'</div>';
    }
  }catch(e){ /* 忽略 */ }
}

async function refreshLog(){
  try{
    const r = await fetch(API + '/admin/log');
    const d = await r.json();
    const lines = d.lines || [];
    if(lines.length !== lastLogLen){
      logEl.textContent = lines.join('\n');
      logEl.scrollTop = logEl.scrollHeight;
      lastLogLen = lines.length;
    }
  }catch(e){ /* 忽略 */ }
}

async function postAction(path, body){
  try{
    const r = await fetch(API + path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{})});
    const d = await r.json();
    $('ctrlHint').textContent = (d.ok==='true'?'✓ ':'⚠ ') + (d.msg || JSON.stringify(d));
    refreshStatus(); refreshLog();
  }catch(e){ $('ctrlHint').textContent = '请求失败：'+e.message; }
}

$('btnStart').onclick   = () => postAction('/admin/start', {model_path:$('pModel').value, ctx:$('pCtx').value, ngl:$('pNgl').value});
$('btnStop').onclick    = () => postAction('/admin/stop');
$('btnRestart').onclick = () => postAction('/admin/restart', {model_path:$('pModel').value, ctx:$('pCtx').value, ngl:$('pNgl').value});

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// 初始 + 定时刷新
refreshStatus(); refreshGPU(); refreshLog();
setInterval(refreshStatus, 2000);
setInterval(refreshGPU, 5000);
setInterval(refreshLog, 1500);
</script>
</body>
</html>
